# DingFlix on the NAS. The DingFlix files are served from /site; everything
# else (Jellyfin's API, pictures, video, its own web page at /web/) is passed
# to the NAS's Jellyfin. One address, no certificate warnings, and it all stays
# on the home network.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ @jellyfin;
    }

    location @jellyfin {
        proxy_pass https://192.168.50.176:15443/jellyfin/jellyfin$request_uri;
        proxy_ssl_verify off;
        proxy_ssl_server_name off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 100m;
        # TerraMaster's proxy only lets pages on its own address use these files.
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
