# DingFlix served from the NAS next to Jellyfin (TerraMaster Docker Manager → Compose).
# Copy index.html, favicon.svg, css/ and js/ into /Volume1/DingFlix-NAS/site
# and default.conf into /Volume1/DingFlix-NAS/nginx, then open http://<NAS>:8099
services:
  dingflix:
    image: nginx:1.27-alpine
    container_name: dingflix
    ports:
      - "8099:80"
    volumes:
      - /Volume1/DingFlix-NAS/site:/usr/share/nginx/html:ro
      - /Volume1/DingFlix-NAS/nginx:/etc/nginx/conf.d:ro
    # Workers run as root so they can read the files whatever permissions the share has.
    command: ["sh", "-c", "sed -i 's/^user .*;/user root;/' /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    restart: unless-stopped
